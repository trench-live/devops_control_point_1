name: Version Update and Docker Deployment Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - release
      - feature
      - hotfix

env:
  NAME_VERSION_FILE: ${{ github.workspace }}/version/version
  RELEASE_BRANCH: release
  MINOR: minor
  PATCH: patch
  VERSION_UP: .github/workflows/script.py
  PYTHON_VERSION: '3.13.2'
  GIT_USER_EMAIL: "artemalesin89778@gmail.com"
  GIT_USER_NAME: "trench-live"
  DOCKER_REPO: ${{ secrets.DOCKER_HUB_LOGIN }}/${{ github.event.repository.name }}

jobs:
  tests:
    name: Run Tests
    uses: trench-live/devops_control_point_1/.github/workflows/test.yml@release
    with:
      version: alpha

  security:
    name: Run Security Checks
    needs: tests
    uses: trench-live/devops_control_point_1/.github/workflows/security.yml@release

  update-version:
    name: Update Version
    needs: security
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse-v.outputs.VERSION }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Parse Branch Name
        id: parse-data
        uses: tj-actions/branch-names@v8

      - name: Validate Branch (Feature/Hotfix)
        id: validate-branch
        if: |
          contains(steps.parse-data.outputs.current_branch, 'feature') || 
          contains(steps.parse-data.outputs.current_branch, 'hotfix')
        run: echo "Valid branch"

      - name: Run Minor Version Update Script
        id: update-minor-version
        if: contains(steps.parse-data.outputs.current_branch, 'feature')
        run: |
          python ${{ env.VERSION_UP }} ${{ env.MINOR }}

      - name: Run Patch Version Update Script
        id: update-patch-version
        if: contains(steps.parse-data.outputs.current_branch, 'hotfix')
        run: |
          python ${{ env.VERSION_UP }} ${{ env.PATCH }}

      - name: Configure Git
        run: |
          git config --global user.email "${{ env.GIT_USER_EMAIL }}"
          git config --global user.name "${{ env.GIT_USER_NAME }}"

      - name: Commit and Push Changes
        run: |
          git add version version_log
          git commit -m "Update version and log"
          git push origin ${{ env.RELEASE_BRANCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        id: parse-v
        run: |
          VERSION=$(cat version)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [update-version]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Debug Docker Hub Login
        run: |
          echo "DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_LOGIN }}"
          echo "REPO_NAME: ${{ github.event.repository.name }}"
          echo "TAG: ${{ env.DOCKER_REPO }}:v${{ needs.update-version.outputs.tag }}"

      - name: Build Docker Image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.DOCKER_REPO }}:v${{ needs.update-version.outputs.tag }}
          load: true
          push: false

  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [ docker-build ]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Push Docker Image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_REPO }}:v${{ needs.update-version.outputs.tag }}