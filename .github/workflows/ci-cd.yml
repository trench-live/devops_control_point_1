name: Version update pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - release
      - feature
      - hotfix

env:
  NAME_VERSION_FILE: ${{ github.workspace }}/version/version
  RELEASE_BRANCH: release
  MINOR: minor
  PATCH: patch
  VERSION_UP: .github/workflows/version_update.py
  REPO_NAME: ${{ github.event.repository.name }}
  PR_NUMBER: ${{ github.event.number }}
  URL_REPO: ${{ github.server_url }}/${{ github.repository }}
  DOCKER_REPO: ${{ secrets.DOCKER_HUB_LOGIN }}/${{ env.REPO_NAME }}
  PYTHON_VERSION: '3.13.2'
  GIT_USER_EMAIL: "artemalesin89778@gmail.com"
  GIT_USER_NAME: "trench-live"

jobs:
  tests:
    name: (TST)
    uses: trench-live/devops_control_point_1/.github/workflows/test.yml@release
    with:
      version: alpha

  security:
    name: Security
    needs: tests
    uses: trench-live/devops_control_point_1/.github/workflows/security.yml@release

  update-version:
    needs: security
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse-v.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Parse branch name
        id: parse-data
        uses: tj-actions/branch-names@v8

      - name: Validate branch (feature/hotfix)
        id: validate_branch
        if: |
          contains(steps.parse-data.outputs.current_branch, 'feature') || 
          contains(steps.parse-data.outputs.current_branch, 'hotfix')
        run: echo "Valid branch"

      - name: Run minor version update script
        id: update-minor-version
        if: |
          contains(steps.parse-data.outputs.current_branch, 'feature')
        run: |
          python ${{ env.VERSION_UP }} ${{ env.MINOR }}

      - name: Run patch version update script
        id: update-patch-version
        if: |
          contains(steps.parse-data.outputs.current_branch, 'hotfix')
        run: |
          python ${{ env.VERSION_UP }} ${{ env.PATCH }}

      - name: Configure Git
        run: |
          git config --global user.email "${{ env.GIT_USER_EMAIL }}"
          git config --global user.name "${{ env.GIT_USER_NAME }}"

      - name: Commit and push changes
        run: |
          git add version version_log
          git commit -m "Update version and log"
          git push origin ${{ env.RELEASE_BRANCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: parse-v
        run: |
          VERSION=$(cat version)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

  docker-build:
    name: (CI) Docker build
    runs-on: ubuntu-latest
    needs: [update-version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./dockerfile
          tags: ${{ env.DOCKER_REPO }}:v${{ needs.update-version.outputs.tag }}
          load: true

  docker-push:
    name: (CI) Docker push
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REPO }}:v${{ needs.update-version.outputs.tag }}