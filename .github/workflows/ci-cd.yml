name: Version update pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - release
      - feature

env:
  NAME_VERSION_FILE: ${{ github.workspace }}/version/version
  RELEASE_BRANCH: release
  MINOR: minor
  PATCH: patch
  VERSION_UP: .github/workflows/script.py
  REPO_NAME: ${{ github.event.repository.name }}
  PR_NUMBER: ${{ github.event.number }}
  URL_REPO: ${{ github.server_url }}/${{ github.repository }}
  # DOCKER_REPO: ${{ secrets.DOCKER_HUB_LOGIN }}/${{env.REPO_NAME}}

jobs:
  tests:
    name: (TST)
    uses: trench-live/devops_control_point_1/.github/workflows/test.yml@release
    with:
      version: alpha

  security:
    name: Security
    needs: tests
    uses: trench-live/devops_control_point_1/.github/workflows/security.yml@release

  update-version:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.13.2'

      - name: Run Python script
        run: |
          python ${{env.VERSION_UP}} ${{env.PATCH}}

      - name: Configure Git
        run: |
          git config --global user.email "artemalesin89778@gmail.com"
          git config --global user.name "trench-live"

      - name: Commit and push changes
        run: |
          git add version version_log
          git commit -m "Update version and log"
          git push origin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: parse-v
        run: |
          VERSION=$(cat version)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

  docker-push:
    name: (CI) Docker push
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [update-version]
    env:
      tag: ${{needs.update-version.outputs.tag}}
    steps:
      - name: Prepare env
        run: |
          echo "show variables"
          echo [${{env.tag}}]
      #
      - name: Сheckout on [${{env.RELEASE_BRANCH}}] and v [${{env.tag}}]
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push Docker image to DockerHub
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_LOGIN }}/${{env.REPO_NAME}}:v${{env.tag}}